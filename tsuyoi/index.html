<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>強そうな方が勝ち｜Wikipediaランダム対戦</title><meta name="robots" content="noindex">
<meta name="description" content="Wikipediaのランダム記事を引いて、強そうな方が勝ち。引き直しは10回まで、戻れない。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 小学生の休み時間のカードバトル。勢いと煽り
   IDEA: トレーディングカードを引いて場に出す
   PICTURE: 大きなカード1枚（相手と並ぶと2枚）
   COLOUR and TYPE: 朱赤の地、生成りのカード、墨の文字。Dela Gothic One＋Zen Kaku Gothic New
   LAYOUT: 左に場（カード）、右にチャット。600px以下は縦に積む */
:root{color-scheme:light dark;--bg:light-dark(#d7372b,#3a0f0c);--card:light-dark(#fbf5e8,#1d1513);--ink:light-dark(#1a1412,#f3e9dc);--sub:light-dark(#6b5c55,#b9a79b);--on:#fff7ec;--ac:light-dark(#1a1412,#ffcf3f);--line:light-dark(#e6dccb,#3a2c28)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Zen Kaku Gothic New",sans-serif;overflow:hidden;height:100dvh;display:flex;flex-direction:column}
h1,.big{font-family:"Dela Gothic One",sans-serif;font-weight:400}
header{flex:none;padding:10px max(3vw,12px) 6px;color:var(--on);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
header h1{margin:0;font-size:clamp(20px,3.6vw,32px);line-height:1.05}
header .info{font-size:13px;opacity:.9}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:4px max(3vw,12px) 6px;width:100%;max-width:1240px;margin:0 auto}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 150px;gap:8px}}
.panel{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.25);min-height:0;overflow:hidden}
#stage{display:flex;flex-direction:column}
#game{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.field{display:grid;gap:8px;max-width:420px}
label{font-size:13px;color:var(--sub)}
input{font:inherit;font-size:16px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);width:100%}
input:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{font:inherit;font-weight:700;min-height:44px;padding:6px 14px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
button.main{background:var(--ink);color:var(--card)}
#cs{flex:none}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top{flex:none;justify-content:space-between}
.cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cardw{display:flex;flex-direction:column;gap:6px;min-height:0}
.cardw>.card,.cardw>.back{flex:1;min-height:0}
.cardw>button,.cardw>.row,.cardw>.left,.cardw>.note,.cardw>.tag{flex:none}
.tag{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{display:flex;flex-direction:column;background:var(--card);border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.28);animation:pop .35s ease-out}
.card .img{flex:1;min-height:40px;background:var(--line) center/cover no-repeat;display:grid;place-items:center;color:var(--sub);font-size:32px;font-family:"Dela Gothic One"}
.card .tx{flex:none;padding:8px 10px 10px}
.card h2{margin:0 0 4px;font-family:"Dela Gothic One";font-weight:400;font-size:clamp(16px,2.6vw,26px);line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0 0 4px;font-size:13px;line-height:1.45;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card a,.card .note{font-size:12px;color:var(--sub)}
.card.win{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac),0 6px 0 rgba(0,0,0,.28)}
.back{border:3px dashed var(--line);border-radius:14px;display:grid;place-items:center;text-align:center;color:var(--sub);padding:10px}
.back .big{font-size:clamp(16px,2.4vw,22px)}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
.left{font-size:13px}.left b{font-size:18px;font-family:"Dela Gothic One";font-weight:400}
.res{font-family:"Dela Gothic One";font-size:clamp(20px,3.6vw,34px);line-height:1.1}
.note{font-size:13px;color:var(--sub)}
.score{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:13px}
.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px}
.chat .big{font-size:16px}
.log{overflow-y:auto;display:grid;gap:4px;align-content:start;padding-right:4px}
.msg{font-size:14px;overflow-wrap:anywhere}.msg b{margin-right:6px}.msg.sys{color:var(--sub);font-size:12px}
.msg.me b{color:light-dark(#b3261e,#ffcf3f)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf71;margin-right:4px}.dot.off{background:#999}
.hide{display:none!important}
footer{flex:none;text-align:center;color:var(--on);font-size:11px;padding:0 12px 6px;opacity:.85}
footer a{color:var(--on)}
@media(max-width:860px){.chat{grid-template-rows:minmax(0,1fr) auto}.chat>div:first-child{display:none}}
@media(max-width:600px){.card p{-webkit-line-clamp:2}.card a{display:none}.cardw .left .note{display:none}}
@media(max-height:620px){.card p{display:none}.lobbynote{display:none}}
</style></head><body>
<header><h1>強そうな方が勝ち</h1><span class="info" id="hinfo">Wikipediaのランダム記事で勝負。引き直しは10回まで、前のには戻れない。</span></header>
<main>
<section class="panel" id="stage">
  <div id="lobby" class="field">
    <div class="big" style="font-size:20px">部屋に入る</div>
    <div><label for="nm">名前</label><input id="nm" maxlength="12" placeholder="名前"></div>
    <div><label for="rc">部屋番号（同じ番号の人と対戦）</label><input id="rc" maxlength="8" inputmode="numeric"></div>
    <div class="row"><button class="main" id="enter">入る</button></div>
    <p class="note lobbynote">遊び方：2人とも記事を引く → 気に入らなければ引き直し（最大10回、引いたら前のには戻れない）→「これで勝負」で決定 → 3人目に入った人が審判になり、名前を伏せた2枚から強そうな方を選ぶ。判定のあとで誰の記事か分かる。</p>
  </div>
  <div id="game" class="hide"></div>
</section>
<aside class="panel chat" id="chatp">
  <div><div class="big">チャット</div><div class="note" id="who">部屋に入ると使えます</div></div>
  <div class="log" id="log"></div>
  <form class="row" id="cf" style="flex-wrap:nowrap"><input id="ci" maxlength="200" placeholder="メッセージ" autocomplete="off" disabled><button id="cs" disabled>送る</button></form>
</aside>
</main>
<footer>記事の文章と画像は <a href="https://ja.wikipedia.org/">ウィキペディア日本語版</a> より（<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja">CC BY-SA 4.0</a>）。チャットは12時間で消えます。</footer>
<script>
{
const RELAY="https://bocch.9zwb7cg864.workers.dev/";
const API="https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=random&grnnamespace=0&grnlimit=1&prop=extracts|pageimages|info&exintro=1&explaintext=1&exsentences=3&piprop=thumbnail&pithumbsize=480&inprop=url";
const MAXDRAW=11; // 最初の1回＋引き直し10回
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let myId=null;try{myId=sessionStorage.getItem("tsy-id")}catch(e){}
if(!myId){myId=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem("tsy-id",myId)}catch(e){}}
const q=new URLSearchParams(location.search);
$("nm").value=store.get("tsy-name")||"";
$("rc").value=q.get("r")||String(Math.floor(1000+Math.random()*9000));

let lastH="",joined=false,me="",room="",ws=null,seen=new Set(),retry=0;
const players=new Map(); // id -> {name,first,last}
const rounds={};         // r -> {picks:{},votes:{},draws:{}}
let R=1;
let local={r:0,draws:0,cur:null,decided:false,busy:false};
const R_=r=>rounds[r]||(rounds[r]={picks:{},votes:{},draws:{}});

$("enter").onclick=()=>{
  me=$("nm").value.trim().slice(0,12);room=$("rc").value.trim().replace(/\D/g,"").slice(0,8);
  if(!me){$("nm").focus();return}if(!room){$("rc").focus();return}
  store.set("tsy-name",me);
  try{history.replaceState(null,"","?r="+room)}catch(e){}
  $("lobby").classList.add("hide");$("game").classList.remove("hide");
  $("ci").disabled=$("cs").disabled=false;
  $("hinfo").innerHTML="部屋 "+esc(room)+" ｜ <button id='cp' style='min-height:32px;padding:2px 10px;border-color:#fff7ec;color:#fff7ec;background:transparent'>招待リンクをコピー</button>";
  $("cp").onclick=async e=>{try{await navigator.clipboard.writeText(location.origin+location.pathname+"?r="+room);e.target.textContent="コピーしました"}catch(_){e.target.textContent=location.origin+location.pathname+"?r="+room}};
  connect();setInterval(hello,12000);setInterval(render,5000);render();
};

function connect(){
  const t="tsyoi-"+room;
  ws=new WebSocket(RELAY.replace("https","wss")+t+"/ws?since=3h");
  ws.onopen=()=>{retry=0;hello();sysmsg("つながりました");if(!joined){joined=true;send({t:"join",r:R})}};
  ws.onmessage=e=>{let ev;try{ev=JSON.parse(e.data)}catch(_){return}
    if(ev.event!=="message"||seen.has(ev.id))return;seen.add(ev.id);
    let m;try{m=JSON.parse(ev.message)}catch(_){return}handle(m,ev.time)};
  ws.onclose=()=>{setTimeout(connect,Math.min(15000,1000*2**retry++))};
}
async function send(m){
  m.id=myId;m.name=me;
  try{await fetch(RELAY+"tsyoi-"+room,{method:"POST",body:JSON.stringify(m)})}catch(e){sysmsg("送れませんでした。電波を確認してください")}
}
function hello(){send({t:"hello",r:R,draws:local.r===R?local.draws:0})}

function handle(m,time){
  if(!m||typeof m.id!=="string")return;
  const p=players.get(m.id)||{name:"",first:time,last:0};
  p.name=String(m.name||"").slice(0,12);p.last=Math.max(p.last,time);players.set(m.id,p);
  const r=Number(m.r)||1;
  if(m.t==="chat")addmsg(p.name,String(m.text||"").slice(0,200),m.id===myId);
  else if(m.t==="hello"||m.t==="draw"){R_(r).draws[m.id]=Math.max(R_(r).draws[m.id]||0,Number(m.draws)||0)}
  else if(m.t==="pick"&&m.a&&typeof m.a.title==="string"){R_(r).picks[m.id]=m.a;R_(r).draws[m.id]=Number(m.draws)||MAXDRAW}
  else if(m.t==="vote"&&typeof m.for==="string"){R_(r).votes[m.id]=m.for}
  else if(m.t==="next"&&r>R){R=r;sysmsg("第"+R+"戦スタート")}
  if(r>R&&m.t!=="hello")R=r;
  if(m.t==="join"&&m.id!==myId)sysmsg(p.name+" さんが入りました");
  render();
}

function order(){ // 先に来た2人が対戦者、3人目が審判、4人目からは観戦
  return [...players.entries()].filter(([,p])=>Date.now()/1000-p.last<3*3600).sort((a,b)=>a[1].first-b[1].first).map(x=>x[0]);
}
const seats=()=>order().slice(0,2),judgeId=()=>order()[2];
const online=id=>{const p=players.get(id);return p&&Date.now()/1000-p.last<40};

async function draw(){
  if(local.busy||local.draws>=MAXDRAW)return;
  local.busy=true;render();
  try{
    const j=await fetch(API).then(r=>r.json());
    const pg=Object.values(j.query.pages)[0];
    local.cur={title:pg.title,ext:(pg.extract||"").slice(0,300),img:pg.thumbnail?pg.thumbnail.source:"",url:pg.fullurl||("https://ja.wikipedia.org/wiki/"+encodeURIComponent(pg.title)),len:pg.length||0};
    local.draws++;send({t:"draw",r:R,draws:local.draws});
  }catch(e){sysmsg("記事を引けませんでした。もう一度押してください")}
  local.busy=false;render();
}
function decide(){if(!local.cur||local.decided)return;local.decided=true;send({t:"pick",r:R,a:local.cur,draws:local.draws});render()}

function card(a,opt={}){
  const img=a.img?`style="background-image:url('${esc(a.img)}')"`:"";
  return `<div class="card${opt.win?" win":""}"><div class="img" ${img}>${a.img?"":"？"}</div><div class="tx"><h2>${esc(a.title)}</h2><p>${esc(a.ext||"（説明なし）")}</p><a href="${esc(a.url)}" target="_blank" rel="noopener">Wikipediaで読む</a> <span class="note">｜${Number(a.len||0).toLocaleString()}バイト</span></div></div>`;
}
function result(r,s,j){
  const x=rounds[r];if(!x||!j)return null;const [a,b]=s;
  if(!x.picks[a]||!x.picks[b])return null;
  const v=x.votes[j];if(v!==a&&v!==b)return null;
  return{w:v,how:"審判 "+esc(players.get(j).name)+" さんの判定"};
}

function render(){
  const g=$("game");if(g.classList.contains("hide"))return;
  if(local.r!==R)local={r:R,draws:0,cur:null,decided:false,busy:false};
  const s=seats(),J=judgeId(),isJ=J===myId,isP=s.includes(myId),opp=s.find(i=>i!==myId);
  const x=R_(R),oname=opp?esc(players.get(opp).name):"";
  if(isP&&!local.cur&&(x.draws[myId]||0)>local.draws)local.draws=Math.min(x.draws[myId],MAXDRAW-1);
  if(isP&&x.picks[myId]&&!local.decided){local.decided=true;local.cur=x.picks[myId];local.draws=x.draws[myId]||MAXDRAW}
  // 成績
  const wins={};let draws=0;for(let r=1;r<=R;r++){const z=s.length===2&&result(r,s,J);if(z){if(z.w)wins[z.w]=(wins[z.w]||0)+1;else draws++}}
  const sc=s.map(i=>`<span><span class="dot${online(i)?"":" off"}"></span>${esc(players.get(i).name)}${i===myId?"（あなた）":""}：<b>${wins[i]||0}勝</b></span>`).join("")+(draws?`<span>引き分け ${draws}</span>`:"");
  $("who").innerHTML=s.length<2?"相手を待っています。招待リンクを送ってください":s.map(i=>esc(players.get(i).name)).join(" vs ")+"　審判："+(J?esc(players.get(J).name)+(isJ?"（あなた）":""):"まだいません")+(isP||isJ?"":"（観戦中）");
  let h=`<div class="row top"><div class="big" style="font-size:18px">第${R}戦</div><div class="score">${sc}</div></div>`;
  const both=s.length===2&&x.picks[s[0]]&&x.picks[s[1]];
  if(!both){
    if(isP){
      const left=MAXDRAW-local.draws;
      h+=`<div class="cards"><div class="cardw"><div class="tag">あなたの記事</div>`;
      h+=local.cur?card(local.cur):`<div class="back"><div><div class="big">まだ引いていません</div><div class="note">押すとWikipediaのランダムな記事が1つ出ます</div></div></div>`;
      if(!local.decided){
        h+=`<div class="row">${local.cur?`<button id="bd" ${local.busy||left<=0?"disabled":""}>${local.busy?"引いています…":"引き直す"}</button><button class="main" id="bk">これで勝負</button>`:`<button class="main" id="bd" ${local.busy?"disabled":""}>${local.busy?"引いています…":"1枚目を引く"}</button>`}</div>`;
        h+=`<div class="left">引き直し残り <b>${local.cur?Math.max(0,left):10}</b> 回${local.cur&&left<=0?"　もう引けません":""} <span class="note">引き直すと前のには戻れません</span></div>`;
      }else h+=`<div class="note">決定しました。相手を待っています。</div>`;
      h+=`</div><div class="cardw"><div class="tag">${opp?oname+" さんの記事":"相手"}</div><div class="back"><div><div class="big">${!opp?"まだいません":x.picks[opp]?"決定済み":"考え中…"}</div><div class="note">${opp?(x.draws[opp]||0)+"回引いた":"招待リンクを送ってください"}</div></div></div></div></div>`;
    }else{
      h+=`<div class="back" style="flex:1"><div><div class="big">${isJ?"あなたは審判です":"観戦中"}</div><div class="note">${s.map(i=>esc(players.get(i).name)+"："+(x.picks[i]?"決定済み":(x.draws[i]||0)+"回引いた")).join("<br>")}${isJ?"<br>2人が決めたら、名前を伏せた2枚が出ます。強そうな方を選んでください":""}</div></div></div>`;
    }
  }else{
    const z=result(R,s,J),blind=!isP&&!z;
    const ord=(R+s[0].charCodeAt(0)+s[1].charCodeAt(0))%2?[s[1],s[0]]:s; // 並びは毎回ばらばら
    const msg=z?"":isJ?"名前は伏せてあります。強そうな方を選んでください。判定のあとで誰の記事か分かります。":isP?(J?"審判の判定を待っています。チャットで推すのはOK。":"審判（3人目）がまだいません。招待リンクを送って、もう1人呼んでください。"):"審判の判定を待っています。";
    h+=z?`<div style="flex:none"><div class="res">${esc(players.get(z.w).name)} の勝ち！</div><div class="note">${z.how}</div></div>`:`<div class="note" style="flex:none">${msg}</div>`;
    h+=`<div class="cards">`+ord.map((i,k)=>{
      const lab="AB"[k];
      const tag=blind?`記事 ${lab}`:`${lab}：${esc(players.get(i).name)}${i===myId?"（あなた）":""}　${x.draws[i]||"?"}回目で決定`;
      return `<div class="cardw"><div class="tag">${tag}</div>${card(x.picks[i],{win:z&&z.w===i})}
      ${isJ&&!z?`<button class="main" data-v="${i}" style="flex:none">${lab} が強そう</button>`:""}</div>`}).join("")+`</div>`;
    if(z)h+=`<div class="row" style="flex:none"><button class="main" id="nx">もう一局</button></div>`;
  }
  if(h===lastH)return;lastH=h;g.innerHTML=h;
  const bd=$("bd");if(bd)bd.onclick=draw;const bk=$("bk");if(bk)bk.onclick=decide;
  const nx=$("nx");if(nx)nx.onclick=()=>{R++;send({t:"next",r:R});render()};
  g.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{R_(R).votes[myId]=b.dataset.v;send({t:"vote",r:R,for:b.dataset.v});render()});
}

function addmsg(n,t,mine){const d=document.createElement("div");d.className="msg"+(mine?" me":"");d.innerHTML=`<b>${esc(n)}</b>${esc(t)}`;push(d)}
function sysmsg(t){const d=document.createElement("div");d.className="msg sys";d.textContent=t;push(d)}
function push(d){const l=$("log"),bottom=l.scrollHeight-l.scrollTop-l.clientHeight<40;l.appendChild(d);if(bottom)l.scrollTop=l.scrollHeight}
$("cf").onsubmit=e=>{e.preventDefault();const t=$("ci").value.trim();if(!t||!room)return;$("ci").value="";send({t:"chat",r:R,text:t.slice(0,200)})};
}
</script>
</body></html>
